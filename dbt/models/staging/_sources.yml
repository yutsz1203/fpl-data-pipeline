sources:
  - name: raw
    schema: raw
    description: Landed API responses, one JSONB payload per file. Loaded by scripts/load_raw.py.
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: master
        description: bootstrap-static snapshot. One row per run_date.
      - name: fixtures
        description: fixtures snapshot. One row per run_date.
      - name: player_summary
        description: element-summary per player. One row per (run_date, player_id). Loaded only after a gameweek finishes.
        config:
          freshness: null