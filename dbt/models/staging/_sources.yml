sources:
  - name: raw
    schema: raw
    description: Landed API responses, one JSONB payload per file. Loaded by scripts/load_raw.py.
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: master
        description: bootstrap-static snapshot. One row per run_date.
      - name: fixtures
        description: fixtures snapshot. One row per run_date.
        columns:
          - name: run_date
            data_tests:
              - relationships:
                  arguments:
                    to: source('raw', 'master')
                    field: run_date
      - name: player_summary
        description: element-summary per player. One row per (run_date, player_id). Loaded only after a gameweek finishes.
        config:
          freshness: null
        columns:
          - name: run_date
            data_tests:
              - relationships:
                  arguments:
                    to: source('raw', 'master')
                    field: run_date
      - name: bzzoiro_events
        description: Bzzoiro Premier League events. One row per event_id, replaced on every load.
      - name: bzzoiro_lineups
        description: Bzzoiro lineups (confirmed or predicted). One row per event_id, replaced on every load.
        config:
          freshness: null
      - name: bzzoiro_squads
        description: Bzzoiro squads with availability. One row per (run_date, team_id).
