name: ci
on:
    pull_request:
    push:
        branches: [main]
jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 
            - run: uv sync --locked
            - run: uv run ruff check .
