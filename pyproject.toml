[project]
name = "fpl-data-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "gspread>=6.2.1",
    "mcp[cli]>=2.3.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "adjusttext>=1.4.0",
    "anyio>=4.15.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "sqlalchemy>=2.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
